<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6d564"/>
      <stop offset="100%" stop-color="#e2b714"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <rect width="64" height="64" rx="14" fill="#ffffff" opacity="0.07"/>
  <!-- floating ascender: the blinking caret -->
  <rect x="27.5" y="9" width="9" height="13" rx="4.5" fill="#26282c"/>
  <!-- letter body: crossbar + stem -->
  <rect x="12" y="27" width="40" height="9" rx="4.5" fill="#26282c"/>
  <rect x="27.5" y="27" width="9" height="28" rx="4.5" fill="#26282c"/>
</svg>
