<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- adaptive: bare glyph on dark chrome, charcoal tile on light chrome -->
  <style>
    .tile { display: none; }
    @media (prefers-color-scheme: light) {
      .tile { display: block; }
    }
  </style>
  <rect class="tile" width="64" height="64" rx="15" fill="#16161a"/>
  <g fill="none" stroke="#f5f5f4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 10 V54"/>
    <path d="M28 34 L42 20"/>
    <path d="M47 15 L55 8"/>
    <path d="M34 30 L54 52"/>
  </g>
</svg>
